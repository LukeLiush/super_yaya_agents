[project]
name = "super-yaya-agents"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "agno>=2.6.12",
    "boto3>=1.42.17",
    "browserforge>=1.2.4",
    "ddgs>=9.10.0",
    "edgartools[ai]>=5.35.1",
    "fastapi>=0.128.0",
    "flask>=3.1.3",
    "google-genai>=2.8.0",
    "groq>=1.0.0",
    "huggingface-hub>=1.2.3",
    "inngest>=0.5.18",
    "lagom>=2.7.7",
    "lxml-html-clean>=0.4.3",
    "markdownify>=1.2.2",
    "msgspec>=0.21.1",
    "newspaper4k>=0.9.4.1",
    "openai>=2.14.0",
    "patchright>=1.60.1",
    "pip>=26.1.2",
    "playwright>=1.60.0",
    "praw>=7.8.1",
    "prefect>=3.7.2",
    "prefect-docker>=0.7.2",
    "pydantic-ai>=1.22.0",
    "pydantic-ai-slim[openai]>=1.22.0",
    "python-dotenv>=1.2.1",
    "scrapling>=0.4.9",
    "slack-bolt>=1.27.0",
    "sqlalchemy>=2.0.45",
    "streamlit>=1.52.2",
    "tabulate>=0.10.0",
    "tenacity>=9.1.2",
    "uvicorn>=0.40.0",
    "yfinance>=1.0",
]

[project.scripts]
yaya = "finance_report.reporting_core.infrastructure.cli.yaya:app"

[tool.setuptools]
packages = ["finance_report", "invesetment_agent"]

[tool.uv]
package = true

[tool.ruff]
# Target version
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# Enable specific rule sets
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes (includes unused imports/variables)
    "I",   # isort (import sorting)
    "B",   # flake8-bugbear (finds bugs)
    "UP",  # pyupgrade (modernize code)
    "RUF", # Ruff-specific rules
]
ignore = ["F401"] # Ignore unused imports globally for now to avoid breaking __init__.py exports, or fix selectively

# Allow autofix for all enabled rules (when possible)
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
known-first-party = ["invesetment_agent"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false # Set to true later for stricter checks
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "ruff>=0.14.10",
]
