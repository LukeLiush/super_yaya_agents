services:
  prefect:
    image: prefecthq/prefect:3-latest
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`${COMPOSE_PROJECT_NAME}.${TRAEFIK_HOST}`)
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.entrypoints=websecure
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls.certresolver=letsencrypt
      - traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=4200
    ports:
      - "4200"
    environment:
      - PREFECT_API_URL=https://${COMPOSE_PROJECT_NAME}.${TRAEFIK_HOST}/api
      - PREFECT_UI_URL=https://${COMPOSE_PROJECT_NAME}.${TRAEFIK_HOST}
      - PREFECT_API_DATABASE_CONNECTION_URL=postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@prefect-db:5432/${DB_NAME}
      - PREFECT_API_KEY=${API_KEY}
      - PREFECT_SERVER_API_HOST=0.0.0.0
      - PREFECT_SERVER_API_PORT=4200
    command:
      - prefect
      - server
      - start
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "4200"
    depends_on:
      prefect-db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import requests; requests.get('http://127.0.0.1:4200/api/health').raise_for_status()" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  prefect-worker:
    image: prefecthq/prefect:3-python3.12
    restart: unless-stopped
    environment:
      - PREFECT_API_URL=http://prefect:4200/api
      - PREFECT_API_KEY=${API_KEY}
    entrypoint: [ "/bin/bash", "-c" ]
    command:
      - "pip install prefect-docker && prefect worker start --pool my-docker-pool --type docker --with-healthcheck --name docker-worker"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      prefect:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "prefect --version" ]
      interval: 30s
      timeout: 10s
      retries: 3

  prefect-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - prefect-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  prefect-postgres-data:
