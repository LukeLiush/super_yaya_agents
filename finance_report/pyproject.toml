[project]
name = "finance-report"
version = "0.1.0"
description = "Finance reporting core and services"
requires-python = ">=3.11"
dependencies = [
    "agno>=2.6.12",
    "fastapi>=0.128.0",
    "inngest>=0.5.18",
    "lagom>=2.7.7",
    "pandas",
    "prefect>=3.7.2",
    "prefect-docker>=0.6.0",
    "pydantic>=2.0",
    "pydantic-settings",
    "python-dotenv>=1.2.1",
    "tenacity>=9.1.2",
    "typer",
    "uvicorn>=0.40.0",
    "yfinance>=1.0",
    "edgartools[ai]>=5.35.1",
    "httpx",
    "rich",
    "slack-sdk",
    "openai>=2.14.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["reporting_core*"]
